  <style>
    :root { color-scheme: light; background: #faf8f0; color: #2c3123; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px 48px; text-align: center; }
    h1 { width: min(100%, 450px); margin: 0 0 28px; font-size: 0; }
    .logo { display: block; width: 100%; height: auto; filter: grayscale(1) contrast(1.15); mix-blend-mode: multiply; }
    .tagline { margin: 0; font-size: clamp(19px, 3.9vw, 25px); font-weight: 400; line-height: 1.5; letter-spacing: -.025em; }
    .selection { margin: 8px 0 0; font-size: clamp(14px, 3.2vw, 16px); line-height: 1.7; font-weight: 400; letter-spacing: .04em; color: #626653; }
    .status { margin: 52px 0 0; font-size: 10px; font-weight: 500; line-height: 1.8; letter-spacing: .32em; text-transform: uppercase; }
    @media (max-height: 740px) { main { padding-top: 24px; padding-bottom: 32px; } h1 { width: min(100%, 350px); margin-bottom: 20px; } .status { margin-top: 36px; } }
    @media (max-height: 530px) and (min-width: 600px) { h1 { width: 220px; margin-bottom: 12px; } .status { margin-top: 24px; } }
  </style>
</head>
<body>
  <main>
    <h1><img class="logo" src="/assets/mykotao-logo.png" alt="MYKOTAO" width="1254" height="1254" fetchpriority="high"></h1>
    <p class="tagline">The best things in Koh Tao.</p>
    <p class="selection">Hand selected. Simple.</p>
    <p class="status">Coming soon</p>
  </main>
</body>
</html>
