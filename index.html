<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fdfaf2">
  <title>MYKOTAO — Coming soon</title>
  <meta name="description" content="The best things in Koh Tao. Hand selected. Coming soon.">
  <link rel="canonical" href="https://mykotao.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="MYKOTAO — Coming soon">
  <meta property="og:description" content="The best things in Koh Tao. Hand selected.">
  <meta property="og:url" content="https://mykotao.com/">
  <meta property="og:image" content="https://mykotao.com/assets/mykotao-logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="/assets/mykotao-logo.png">
  <style>
    :root { color-scheme: light; background: #fdfaf2; color: #2c3123; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px 48px; text-align: center; }
    h1 { width: min(100%, 450px); margin: 0 0 28px; font-size: 0; }
    .logo { display: block; width: 100%; height: auto; }
    .tagline, .selection, .status, .follow { font-size: 10px; font-weight: 500; line-height: 1.8; letter-spacing: .32em; text-transform: uppercase; }
    .tagline { margin: 0; }
    .selection { margin: 10px 0 0; }
    .status { margin: 38px 0 0; }
    .follow { display: inline-flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 28px; color: inherit; text-decoration: none; }
    .follow svg { width: 24px; height: 24px; }
    .instagram-icon { display: grid; place-items: center; width: 44px; height: 44px; }
    .follow:hover { opacity: .65; }
    .follow:focus-visible { outline: 1px solid currentColor; outline-offset: 8px; }
    @media (max-height: 800px) { main { padding-top: 20px; padding-bottom: 24px; } h1 { width: min(100%, 330px); margin-bottom: 18px; } .status { margin-top: 28px; } .follow { margin-top: 20px; gap: 8px; } }
    @media (max-width: 380px) { .tagline { font-size: 9px; letter-spacing: .25em; } }
    @media (max-height: 530px) and (min-width: 600px) { h1 { width: 180px; margin-bottom: 12px; } .status { margin-top: 16px; } .follow { margin-top: 12px; gap: 4px; } }
  </style>
</head>
<body>
  <main>
    <h1><img class="logo" src="/assets/mykotao-logo.png" alt="MYKOTAO" width="1254" height="1254" fetchpriority="high"></h1>
    <p class="tagline">THE BEST THINGS IN KOH TAO</p>
    <p class="selection">HAND SELECTED</p>
    <p class="status">COMING SOON</p>
    <a class="follow" href="https://www.instagram.com/mykotao/" target="_blank" rel="noopener noreferrer" aria-label="Follow MYKOTAO on Instagram">
      <span>FOLLOW</span>
      <span class="instagram-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".9" fill="currentColor" stroke="none"/></svg></span>
    </a>
  </main>
</body>
</html>
