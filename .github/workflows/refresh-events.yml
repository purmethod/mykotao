name: Refresh Koh Tao events
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_events.py'
      - 'tests/test_events.py'
      - 'data/sources.json'
      - '.github/workflows/refresh-events.yml'
permissions:
  contents: write
concurrency:
  group: event-collector
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify date and source handling
        run: python3 -m unittest discover -s tests
      - name: Collect upcoming events
        run: python3 scripts/collect_events.py
      - name: Save updated event data
        run: |
          git config user.name "MYKOTAO Events"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh upcoming Koh Tao events"
            git push origin HEAD:main
          fi

